name: E2E Testnet

# The two live Stellar Testnet suites of plan 0007 (`pnpm test:e2e:testnet`), one job each, in parallel:
# - Suite A (tests/e2e-testnet/journey.test.ts): the user journey on the official deployment
#   (config/manifests/testnet.json), with fresh keypairs onboarded through the public faucet.
# - Suite B (tests/e2e-testnet/lifecycle.test.ts): a throwaway market deployed by scripts/dev-stack/deploy.sh
#   (EPHEMERAL=1) with four keys generated in the run and removed afterwards, from principal at the
#   manifest's sourceCommit.
# No repository secret is used and no key is set in any environment: both suites make their keys in the run.
on:
  pull_request:
    branches: [testnet, main]
  workflow_dispatch:
  schedule:
    # Nightly. Schedules run the default branch's copy of this file (main). Off the hour, as GitHub advises.
    - cron: "17 3 * * *"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. The nightly and manual runs are never cancelled.
concurrency:
  group: e2e-testnet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  journey:
    name: "Suite A: live journey"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Suite A (journey.test.ts)
        # About 5 minutes. Stops before the job's limit so the record is still uploaded.
        timeout-minutes: 38
        run: pnpm test:e2e:testnet tests/e2e-testnet/journey.test.ts
      - name: Upload the run record (e2e-artifacts/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journey-${{ github.run_attempt }}
          path: e2e-artifacts/
          retention-days: 30
          if-no-files-found: warn

  lifecycle:
    name: "Suite B: ephemeral lifecycle"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dapp
    env:
      # The local layout: dapp/ and principal/ side by side.
      PRINCIPAL_REPO: ${{ github.workspace }}/principal
      # deploy.sh builds into ${TMPDIR:-/tmp}/principal-dev-stack/<commit> and reuses a build found there.
      # Pinned so the cache steps below and deploy.sh name the same directory.
      TMPDIR: /tmp
      # The Stellar CLI that deployed the official market. The release publishes no checksum file: this is
      # the sha256 digest GitHub lists for stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz.
      STELLAR_CLI_VERSION: 28.1.0
      STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
      STELLAR_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: dapp
          persist-credentials: false
      - name: Read the official deployment's source commit
        id: manifest
        run: |
          set -euo pipefail
          commit="$(jq -er '.sourceCommit' config/manifests/testnet.json)"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::config/manifests/testnet.json sourceCommit is not a full commit hash"
            exit 1
          fi
          echo "principal at $commit"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "build-dir=$TMPDIR/principal-dev-stack/$commit" >>"$GITHUB_OUTPUT"
      - name: Check out principal at that commit
        uses: actions/checkout@v4
        with:
          repository: principal-Protocol-org/principal
          ref: ${{ steps.manifest.outputs.commit }}
          path: principal
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          package_json_file: dapp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the Stellar CLI ${{ env.STELLAR_CLI_VERSION }} (release binary, checksum verified)
        run: |
          set -euo pipefail
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/$archive"
          echo "$STELLAR_CLI_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/stellar-cli" stellar
          echo "$RUNNER_TEMP/stellar-cli" >>"$GITHUB_PATH"
      # The rustc that built the official deployment: at 665bb67 it reproduces the manifest's wasmHashes
      # byte for byte, so the throwaway market runs the same wasm. Stable would drift with each release.
      - name: Install Rust 1.95.0 with the wasm32v1-none target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32v1-none
      # Only the .wasm files are cached (about 0.5 MB): deploy.sh reads nothing else from its build directory.
      # Exact key, no restore-keys: another commit's wasm must never land in this commit's directory.
      - name: Restore the contract build
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.manifest.outputs.build-dir }}/target/wasm32v1-none/release/*.wasm
          key: principal-wasm-${{ steps.manifest.outputs.commit }}
      - name: Restore the cargo registry
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('principal/Cargo.lock') }}
      - name: Build the contracts
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.manifest.outputs.commit }}
          BUILD_DIR: ${{ steps.manifest.outputs.build-dir }}
        # deploy.sh's own extraction and build, run here so the build is a step of its own (outside the
        # suite's deploy budget) and its cache is saved even when the suite fails.
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          git -C "$PRINCIPAL_REPO" archive "$COMMIT" | tar -x -C "$BUILD_DIR"
          (cd "$BUILD_DIR" && cargo build --workspace --release --target wasm32v1-none)
          # deploy.sh reuses the build when these two exist.
          for f in principal_router.wasm principal_market_factory.wasm; do
            test -f "$BUILD_DIR/target/wasm32v1-none/release/$f"
          done
      - name: Save the contract build
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.manifest.outputs.build-dir }}/target/wasm32v1-none/release/*.wasm
          key: principal-wasm-${{ steps.manifest.outputs.commit }}
      - name: Check the tools deploy.sh needs
        run: |
          set -euo pipefail
          stellar --version | grep -F "stellar $STELLAR_CLI_VERSION "
          rustc --version
          cargo --version
          jq --version
          node --version
          git --version
          shasum --version
      - name: Compare the wasm with the official deployment's (informational)
        env:
          COMMIT: ${{ steps.manifest.outputs.commit }}
          WASM_DIR: ${{ steps.manifest.outputs.build-dir }}/target/wasm32v1-none/release
        run: |
          set -euo pipefail
          official="$(jq -r '.wasmHashes[]' config/manifests/testnet.json)"
          same=0
          total=0
          {
            echo "### Contracts built from principal at $COMMIT"
            echo "| wasm | sha256 | in testnet.json wasmHashes |"
            echo "|---|---|---|"
            for f in "$WASM_DIR"/*.wasm; do
              hash="$(sha256sum "$f" | cut -d' ' -f1)"
              total=$((total + 1))
              if grep -qxF "$hash" <<<"$official"; then same=$((same + 1)); match=yes; else match=no; fi
              echo "| $(basename "$f") | \`$hash\` | $match |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$same of $total wasm files are byte-identical to the official deployment's"
      - name: Suite B (lifecycle.test.ts)
        # About 22 minutes, set by the market's 20-minute maturity. Stops before the job's limit so the
        # record is still uploaded.
        timeout-minutes: 38
        run: pnpm test:e2e:testnet tests/e2e-testnet/lifecycle.test.ts
      - name: Upload the run record (e2e-artifacts/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lifecycle-${{ github.run_attempt }}
          path: dapp/e2e-artifacts/
          retention-days: 30
          if-no-files-found: warn
