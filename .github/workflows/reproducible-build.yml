# Rebuilds the Mainnet contracts from source and compares the 12 wasm files with the code on chain: a public log of
# the "build is reproducible from source" criterion (SCF Tranche 3, Deliverable 1).
#
# The deployed source commit is the manifest's `sourceCommit`. The build is the contracts team's: rustc 1.94.1,
# `cargo build --workspace --release --locked --target wasm32v1-none`, on Linux x86_64. Ten of the twelve deployed
# files contain the cargo directory of the original build (a home directory). The job reads that path from a deployed
# file, masks it in the log, and maps the runner's own cargo directory to it; the path is never written to this file
# or printed. It publishes no artifact: the rebuilt files contain the path.
#
# Reads only: the public Mainnet RPC gateway, the manifest's addresses and hashes. Signs nothing.
name: Reproducible build (Mainnet contracts)

on:
  # A pull request that changes this file runs it; afterwards, run it by hand.
  pull_request:
    paths: [.github/workflows/reproducible-build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RPC_URL: https://soroban-rpc.mainnet.stellar.gateway.fm
  NETWORK_PASSPHRASE: Public Global Stellar Network ; September 2015
  RUST_VERSION: 1.94.1
  # The Stellar CLI that the end-to-end job uses; the sha256 digest GitHub lists for its x86_64 Linux archive.
  STELLAR_CLI_VERSION: 28.1.0
  STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
  STELLAR_NO_UPDATE_CHECK: "1"

jobs:
  rebuild:
    name: Rebuild and compare with the chain
    # The host is part of the recipe: on another OS or architecture the bytes differ.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: dapp
          persist-credentials: false
      - name: Read the deployed source commit and one contract per code from the manifest
        id: manifest
        run: |
          set -euo pipefail
          m=dapp/config/manifests/mainnet.json
          commit="$(jq -er '.sourceCommit' "$m")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sourceCommit is not a full commit hash"; exit 1; }
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          # file name (crate) -> manifest key -> one deployed contract running that code (shared ones, then MOCKUSDY's)
          jq -r '
            . as $m
            | [["principal_router","router",$m.shared.router],
               ["principal_permissioning","permissioning",$m.shared.permissioning],
               ["principal_risk_control","riskControl",$m.shared.riskControl],
               ["principal_market_factory","factory",$m.shared.factory],
               ["principal_oracle_adapter","oracle",$m.markets[0].contracts.oracle],
               ["principal_sy_wrapper","sy",$m.markets[0].contracts.sy],
               ["principal_pt_token","pt",$m.markets[0].contracts.pt],
               ["principal_yt_token","yt",$m.markets[0].contracts.yt],
               ["principal_market_config","config",$m.markets[0].contracts.config],
               ["principal_manager","manager",$m.markets[0].contracts.manager],
               ["principal_market_pool","pool",$m.markets[0].contracts.pool],
               ["principal_recovery_escrow","recoveryEscrow",$m.markets[0].contracts.recoveryEscrow]][]
            | "\(.[0]) \(.[1]) \(.[2]) \($m.wasmHashes[.[1]])"' "$m" >"$RUNNER_TEMP/codes.txt"
          test "$(wc -l <"$RUNNER_TEMP/codes.txt")" -eq 12
          awk '{ if ($3 !~ /^C[A-Z2-7]{55}$/ || $4 !~ /^[0-9a-f]{64}$/) bad = 1 } END { exit bad }' "$RUNNER_TEMP/codes.txt"
          echo "principal at $commit"
      - name: Check out principal at that commit
        uses: actions/checkout@v4
        with:
          repository: principal-Protocol-org/principal
          ref: ${{ steps.manifest.outputs.commit }}
          path: principal
          persist-credentials: false
      - name: Install the Stellar CLI ${{ env.STELLAR_CLI_VERSION }} (release binary, checksum verified)
        run: |
          set -euo pipefail
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/$archive"
          echo "$STELLAR_CLI_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/stellar-cli" stellar
          echo "$RUNNER_TEMP/stellar-cli" >>"$GITHUB_PATH"
      - name: Install Rust ${{ env.RUST_VERSION }} with the wasm32v1-none target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32v1-none
          rustc "+$RUST_VERSION" --version
          uname -m
      - name: Fetch the deployed code of each contract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/onchain"
          while read -r file _key id _hash; do
            for attempt in 1 2 3; do
              stellar contract fetch --id "$id" --rpc-url "$RPC_URL" --network-passphrase "$NETWORK_PASSPHRASE" \
                -o "$RUNNER_TEMP/onchain/$file.wasm" && break
              sleep $((attempt * 5))
            done
            test -s "$RUNNER_TEMP/onchain/$file.wasm"
            sleep 1
          done <"$RUNNER_TEMP/codes.txt"
      - name: Rebuild, with the cargo directory mapped to the one recorded on chain
        working-directory: principal
        run: |
          set -euo pipefail
          # The recorded cargo directory, read from the deployed pool; masked before anything could print it.
          orig="$(grep -ao '/home/[^/]*/\.cargo' "$RUNNER_TEMP/onchain/principal_market_pool.wasm" | head -1)"
          [ -n "$orig" ] || { echo "::error::no cargo directory found in the deployed pool"; exit 1; }
          echo "::add-mask::$orig"
          echo "::add-mask::$(basename "$(dirname "$orig")")"
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=$orig --remap-path-prefix=$PWD=/build"
          cargo "+$RUST_VERSION" build --workspace --release --locked --target wasm32v1-none
      - name: Compare the 12 rebuilt files with the code on chain
        env:
          COMMIT: ${{ steps.manifest.outputs.commit }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/table.md"
          {
            echo "Rebuilt from \`principal\` at \`$COMMIT\`, rustc $RUST_VERSION, $(uname -sm)."
            echo
            echo "| File | Rebuilt SHA-256 | On chain (contract) | Manifest | Result |"
            echo "|---|---|---|---|---|"
          } >"$out"
          matches=0
          while read -r file key id hash; do
            rebuilt="$(sha256sum "principal/target/wasm32v1-none/release/$file.wasm" | cut -d' ' -f1)"
            onchain="$(sha256sum "$RUNNER_TEMP/onchain/$file.wasm" | cut -d' ' -f1)"
            if [ "$rebuilt" = "$onchain" ] && [ "$rebuilt" = "$hash" ]; then result=match; matches=$((matches + 1)); else result=DIFFERS; fi
            echo "| \`$file.wasm\` | \`$rebuilt\` | \`$onchain\` (${id:0:6}…${id: -4}) | \`$key\` | $result |" >>"$out"
          done <"$RUNNER_TEMP/codes.txt"
          { echo; echo "**$matches of 12 match.**"; } >>"$out"
          cat "$out"
          cat "$out" >>"$GITHUB_STEP_SUMMARY"
          [ "$matches" -eq 12 ]
