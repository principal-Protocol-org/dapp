name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Fail if server secrets (faucet, database, cron, QStash, oracle keeper) reach the client bundle
        # Fails when the client bundle is missing too, so the check can never pass vacuously (R12).
        run: test -d .next/static && ! grep -rqE 'FAUCET_|DATABASE_URL|CRON_SECRET|QSTASH_|ORACLE_ADMIN_' .next/static
